name: Verify and build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.6.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch verified local collector
        run: pnpm sidecar:ensure

      - name: Run all checks
        run: pnpm verify

      - name: Build ad-hoc signed app
        run: pnpm package:mac

      - name: Preserve the macOS app bundle
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "src-tauri/target/release/bundle/macos/쌀먹.app"
          "쌀먹-macos-arm64.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssalmeok-macos-arm64
          path: 쌀먹-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
